<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
       html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
}
        .index{
            text-align: center;
           
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding-top: 30px;
        }
        .index a{
            text-decoration: none;
            color: white;
            background-color: black;
            padding:8px;
            width:100px;
            border-radius: 10px;
        }
         .index a:hover{
            color:white;
            background-color:rgb(107, 102, 102);
            cursor: pointer;
        }
       .heading{
        background-color: #E65100;
        height:100px;
        width: 100%;
        justify-content: center;
        align-items: center;
        display: flex;
       color: white;
       flex-direction: column;

      }
      .title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-box i {
            font-size: 24px; 

        }
        .heading h2, .heading h4 {
            margin: 0;
        }
        .main {
            height: auto;
            width:300px;
            border: 2px solid gainsboro;
            text-align: center;
            border-radius: 10px;
            transition: transform 0.3s;
       padding-bottom: 15px;
       overflow: hidden;
        }
        .main img{
            display: block;
                    width: 100%;
    height:240px;
    object-fit: contain;
    background-color: #f8f8f8;
    padding: 5px; 
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
    object-position: center;
}
    
        .main p{
           color:#E65100;
           font-weight: bold;
        }
        .main button{
                  color:white;
                  background-color:#E65100;
                  height: 30px;
                  width:250px;
                  font-weight: bold;
                  border: none;
            border-radius: 5px;
            cursor: pointer;
                 
        }
        .main:hover{
            transform:translateY(-20px);
           
        }
        .container{
            flex: 1;
         width: 100%;
    display: flex;
    justify-content: center; 
    align-items: center;     
    padding-top: 40px;      
    padding-bottom: 40px;
            
        }
         .bottom{
            text-align: center;
            color:white;
            background-color: black;
            height: 60px;
            width: 100%;
            padding: 20px;
            overflow: hidden;
            margin-top: auto;
          
        }
        @media screen and (max-width: 767px) {
            .heading {
                height: auto;
                padding: 15px 10px;
            }
            .heading h2 {
                font-size: 20px;
            }
            .heading h4 {
                font-size: 13px;
            }
            .index {
                flex-wrap: wrap;
                gap: 10px;
                padding: 15px 10px 0 10px;
            }
            .index a {
                width: 28%;
                min-width: 85px;
                font-size: 13px;
            }
            .container {
                padding: 20px 15px;
            }
            .main {
                width: 100%;
                max-width: 320px;
            }
            .main button {
                width: 85%;
            }
            .main:hover {
                transform: none; 
            }
            .bottom h3{
                font-size: 14px;
            }
        }
        </style>
</head>
<body>
    <div class="heading">
        <div class="title-box">
            <i class="fa-solid fa-utensils"></i>
            <h2>Food Junction</h2>
        </div>
        <h4>Delicious Food, Happy Mood</h4>
    </div>
    <div class="index">
        <a href="index.html">All</a>
        <a href="pizza.html">Pizza</a>
        <a href="burger.html">Burger</a>
          <a href="french.html">French Fries</a>
        <a href="pasta.html"> Pasta</a>
        <a href="drinks.html">Drinks</a>

    </div>
    <div class="container">
    <div class="main">
            <img src="french.jpg" alt="pizza">
            <h3>French Fries</h3>
            <p>&#8377;199</p>
            <button class="order-btn">Order Now</button>
        </div>
       
    </div>
    <div class="bottom">
        <h3><i class="fa-regular fa-copyright"></i>&nbsp;&nbsp;2026 Food Junction | All Rights Reserved</h3>
    </div>
     <script>
       
        const orderButtons = document.querySelectorAll('.order-btn');

       
        orderButtons.forEach((button) => {
            button.addEventListener('click', function () {
               
                const itemTitle = this.parentElement.querySelector('h3').innerText;
                
                
                alert(`Your order for ${itemTitle} is confirmed!`);
            });
        });
    </script>
</body>
</html>
