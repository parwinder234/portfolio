<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
  <style>
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif, sans-serif;
        }

        body {
            background-color: #0b1a2d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }


        header {
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: bold;
            color: #29b6a6;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: #29b6a6;
        }

        
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 60px 8%;
            flex: 1;
            gap: 40px;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero-text h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .hero-text h1 span {
            color: #29b6a6;
        }

        .hero-text h3 {
            font-size: 1.3rem;
            color: #3b82f6;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .hero-text p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e5e7eb;
            margin-bottom: 35px;
            max-width: 480px;
        }

    
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #faebd7;
            color: #0b1a2d;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.2s, background-color 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #29b6a6;
            color: #ffffff;
        }


        .social-icons {
            display: flex;
            gap: 25px;
        }

        .social-icons a {
            color: #29b6a6;
            font-size: 1.6rem;
            text-decoration: none;
            transition: transform 0.2s, color 0.2s;
        }

        .social-icons a:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        
        .hero-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-circle {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #29b6a6;
            box-shadow: 0 0 20px rgba(41, 182, 166, 0.2);
        }

        .image-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

    
           
           
        @media screen and (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                align-items: center;
                padding: 15px 4%;
            }

            .nav-links {
                gap: 12px;
                font-size: 0.9rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            
            .hero {
                flex-direction: column-reverse; 
                padding: 30px 5%;
                gap: 30px;
                text-align: center;
            }

            .hero-text {
                max-width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .hero-text h1 {
                font-size: 2.1rem;
            }

            .hero-text h3 {
                font-size: 1.1rem;
                margin-bottom: 15px;
            }

            .hero-text p {
                font-size: 0.95rem;
                margin-bottom: 25px;
            }

            .btn-group {
                justify-content: center;
                width: 100%;
                gap: 10px;
            }

            .btn {
                padding: 10px 16px;
                font-size: 0.85rem;
            }

            .social-icons {
                justify-content: center;
            }

            
            .image-circle {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Parwinder.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="aboutme.html">About Me</a></li>
            <li><a href="skill.html">Skills</a></li>
            <li><a href="project.html">Projects</a></li>
            <li><a href="resume.html">resume</a></li>
            <li><a href="#contact">Contact Us</a></li>
        </ul>
    </header>

    
    <main class="hero" id="home">

    
        <div class="hero-text">
            <h1>Hi,I'm <span>Parwinder Kaur</span></h1>
            <h3>Front-end Web Developer</h3>
            <p>Welcome to my portfolio ! i am a passionate Front-End web Developer with skills in HTML, CSS, Javascript, PHP, MYSQL</p>
            
            <div class="btn-group">
                <a href="contactus.html" class="btn">Hire Me</a>
                <a href="resume.pdf" class="btn">Download Resume</a>
                <a href="project.html" class="btn">View Projects</a>
            </div>

            <div class="social-icons">
                <a href="mailto:your-email@example.com" title="Email"><i class="fas fa-envelope"></i></a>
                <a href="#" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>

    
        <div class="hero-image">
            <div class="image-circle">
                <img src="photo2.jpg" alt="Parwinder Kaur">
            </div>
        </div>

    </main>

</body>
</html>
